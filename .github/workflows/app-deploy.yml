name: "Application Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "Build and Deploy Application"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload static assets to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: "app/public/assets"
          DEST_DIR: "assets"

      - name: Create deployment package
        run: |
          cd app
          mkdir -p deploy
          cp -r .output api package.json package-lock.json ecosystem.config.js deploy/
          cd deploy
          tar -czf ../agrolink-app.tar.gz .
          cd ..

      - name: Deploy to EC2 Instance 1
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/agrolink-app.tar.gz"
          target: "/tmp"

      - name: Deploy to EC2 Instance 2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/agrolink-app.tar.gz"
          target: "/tmp"

      - name: Execute deployment on EC2 Instance 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create app directory if not exists
            mkdir -p /home/${{ secrets.EC2_USER }}/agrolink
            mkdir -p /home/${{ secrets.EC2_USER }}/agrolink/logs

            # Extract deployment package
            cd /home/${{ secrets.EC2_USER }}/agrolink
            tar -xzf /tmp/app/agrolink-app.tar.gz

            # Install production dependencies for API
            cd api
            npm ci --only=production
            cd ..

            # Restart PM2 processes
            pm2 delete all || true
            pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            rm -f /tmp/app/agrolink-app.tar.gz

      - name: Execute deployment on EC2 Instance 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create app directory if not exists
            mkdir -p /home/${{ secrets.EC2_USER }}/agrolink
            mkdir -p /home/${{ secrets.EC2_USER }}/agrolink/logs

            # Extract deployment package
            cd /home/${{ secrets.EC2_USER }}/agrolink
            tar -xzf /tmp/app/agrolink-app.tar.gz

            # Install production dependencies for API
            cd api
            npm ci --only=production
            cd ..

            # Restart PM2 processes
            pm2 delete all || true
            pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            rm -f /tmp/app/agrolink-app.tar.gz

      - name: Invalidate CloudFront cache (Optional)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Deployment successful
        run: |
          echo "✅ Application deployed successfully!"
          echo "📦 Static assets uploaded to S3"
          echo "🚀 Application running on both EC2 instances"
          echo "💚 Frontend (port 3000) and API (port 4000) restarted via PM2"
