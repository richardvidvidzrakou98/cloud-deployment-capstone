name: "Application Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "Build and Deploy Application"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload static assets to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: "app/public/assets"
          DEST_DIR: "assets"

      - name: Create deployment package
        run: |
          cd app
          mkdir -p deploy
          cp -r .output api package.json package-lock.json ecosystem.config.cjs deploy/
          cd deploy
          tar -czf ../agrolink-app.tar.gz .
          cd ..

      - name: Upload deployment package to S3
        run: |
          aws s3 cp app/agrolink-app.tar.gz s3://${{ secrets.AWS_S3_BUCKET }}/deployments/agrolink-app.tar.gz
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Execute deployment on EC2 Instance 1 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.AWS_INSTANCE_ID_1 }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands": [
                "mkdir -p /home/ec2-user/agrolink",
                "mkdir -p /home/ec2-user/agrolink/logs",
                "aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/deployments/agrolink-app.tar.gz /tmp/agrolink-app.tar.gz",
                "cd /home/ec2-user/agrolink",
                "tar -xzf /tmp/agrolink-app.tar.gz",
                "cd api",
                "npm ci --only=production",
                "cd ..",
                "pm2 delete all || true",
                "pm2 start ecosystem.config.cjs",
                "pm2 save",
                "rm -f /tmp/agrolink-app.tar.gz"
              ]
            }' \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Execute deployment on EC2 Instance 2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.AWS_INSTANCE_ID_2 }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands": [
                "mkdir -p /home/ec2-user/agrolink",
                "mkdir -p /home/ec2-user/agrolink/logs",
                "aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/deployments/agrolink-app.tar.gz /tmp/agrolink-app.tar.gz",
                "cd /home/ec2-user/agrolink",
                "tar -xzf /tmp/agrolink-app.tar.gz",
                "cd api",
                "npm ci --only=production",
                "cd ..",
                "pm2 delete all || true",
                "pm2 start ecosystem.config.cjs",
                "pm2 save",
                "rm -f /tmp/agrolink-app.tar.gz"
              ]
            }' \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Deployment successful
        run: |
          echo "✅ Application deployed successfully!"
          echo "📦 Static assets uploaded to S3"
          echo "🚀 Application running on both EC2 instances"
          echo "💚 Frontend (port 3000) and API (port 4000) restarted via PM2"
